[package]
name = "arctis"
version = "0.1.0"
description = "Arctis - Trading Decision Support"
authors = ["you"]
edition = "2021"

[lib]
name = "arctis_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
