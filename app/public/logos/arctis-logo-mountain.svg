<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient (deep navy) -->
    <radialGradient id="bgGrad" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>

    <!-- Mountain ice gradient -->
    <linearGradient id="mountainGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="35%" stop-color="#8ac8ff"/>
      <stop offset="100%" stop-color="#3a7abf"/>
    </linearGradient>

    <!-- Shadow face gradient -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d2240"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Peak glow -->
    <filter id="peakGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Green accent gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e088" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e088"/>
      <stop offset="100%" stop-color="#00e088" stop-opacity="0"/>
    </linearGradient>

    <!-- Wordmark clip -->
    <clipPath id="logoClip">
      <rect x="0" y="0" width="512" height="512"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="32" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines (fintech feel) -->
  <g opacity="0.06" stroke="#64b5ff" stroke-width="0.5">
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="240" x2="512" y2="240"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- ============ ICON AREA (top ~340px) ============ -->

  <!-- Back mountain (left) -->
  <polygon
    points="90,310 188,130 256,220"
    fill="#1a3a5c"
    opacity="0.7"
  />

  <!-- Back mountain (right) -->
  <polygon
    points="420,310 310,145 256,220"
    fill="#1e3f62"
    opacity="0.7"
  />

  <!-- Main iceberg — light face -->
  <polygon
    points="256,72 360,290 152,290"
    fill="url(#mountainGrad)"
    filter="url(#glow)"
  />

  <!-- Main iceberg — shadow face (right) -->
  <polygon
    points="256,72 360,290 256,230"
    fill="url(#shadowGrad)"
    opacity="0.85"
  />

  <!-- Snow cap highlight -->
  <polygon
    points="256,72 292,148 220,148"
    fill="#e8f4ff"
    opacity="0.95"
  />

  <!-- Peak bright dot -->
  <circle cx="256" cy="72" r="5" fill="#ffffff" filter="url(#peakGlow)"/>

  <!-- Submerged iceberg base (below water) -->
  <polygon
    points="152,290 200,340 312,340 360,290"
    fill="#1a3a5c"
    opacity="0.6"
  />
  <polygon
    points="200,340 230,368 282,368 312,340"
    fill="#162d4a"
    opacity="0.5"
  />

  <!-- Waterline -->
  <line x1="80" y1="290" x2="432" y2="290" stroke="#64b5ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Water reflection shimmer -->
  <ellipse cx="256" cy="295" rx="80" ry="6" fill="#64b5ff" opacity="0.08"/>
  <ellipse cx="256" cy="300" rx="55" ry="4" fill="#8ac8ff" opacity="0.06"/>

  <!-- Green baseline accent -->
  <rect x="128" y="350" width="256" height="2" rx="1" fill="url(#greenGrad)"/>

  <!-- ============ WORDMARK ============ -->
  <text
    x="256"
    y="415"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="14"
    text-anchor="middle"
    fill="#e8f4ff"
  >ARCTIS</text>

  <!-- Tagline -->
  <text
    x="256"
    y="447"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="5"
    text-anchor="middle"
    fill="#64b5ff"
    opacity="0.8"
  >TRADING INTELLIGENCE</text>

  <!-- Bottom accent line under wordmark -->
  <line x1="196" y1="458" x2="316" y2="458" stroke="#00e088" stroke-width="1" opacity="0.6"/>
</svg>
