<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgCompass" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>

    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ac8ff"/>
      <stop offset="50%" stop-color="#64b5ff"/>
      <stop offset="100%" stop-color="#3a6090"/>
    </linearGradient>

    <!-- North needle gradient -->
    <linearGradient id="northGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#8ac8ff"/>
    </linearGradient>

    <!-- South needle gradient -->
    <linearGradient id="southGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d2240"/>
    </linearGradient>

    <!-- Compass face gradient -->
    <radialGradient id="faceFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#112038" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Green accent -->
    <linearGradient id="greenAccent" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00e088"/>
      <stop offset="100%" stop-color="#00a860"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="compassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="needleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="centerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tick mark clip -->
    <clipPath id="compassClip">
      <circle cx="256" cy="212" r="115"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="32" fill="url(#bgCompass)"/>

  <!-- ===================== COMPASS ===================== -->
  <!-- Outer decorative ring (outermost) -->
  <circle cx="256" cy="212" r="132" fill="none" stroke="#64b5ff" stroke-width="0.5" opacity="0.2"/>
  <circle cx="256" cy="212" r="128" fill="none" stroke="#64b5ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Outer ring main border -->
  <circle cx="256" cy="212" r="124" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.7"/>

  <!-- Compass face -->
  <circle cx="256" cy="212" r="122" fill="url(#faceFill)"/>

  <!-- Concentric inner rings -->
  <circle cx="256" cy="212" r="100" fill="none" stroke="#64b5ff" stroke-width="0.8" opacity="0.18"/>
  <circle cx="256" cy="212" r="78" fill="none" stroke="#64b5ff" stroke-width="0.8" opacity="0.14"/>

  <!-- Degree tick marks (every 10°) -->
  <g stroke="#64b5ff" stroke-width="1" opacity="0.3">
    <!-- 36 ticks at 10° intervals -->
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(0 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(10 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(20 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(30 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(40 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(50 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(60 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(70 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(80 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(100 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(110 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(120 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(130 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(140 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(150 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(160 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(170 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(190 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(200 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(210 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(220 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(230 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(240 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(250 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(260 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(280 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(290 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(300 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(310 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(320 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(330 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(340 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="98" transform="rotate(350 256 212)"/>
  </g>

  <!-- Cardinal direction ticks (N, E, S, W — larger) -->
  <g stroke="#8ac8ff" stroke-width="2" opacity="0.6">
    <line x1="256" y1="90" x2="256" y2="102" transform="rotate(0 256 212)"/>   <!-- N -->
    <line x1="256" y1="90" x2="256" y2="102" transform="rotate(90 256 212)"/>  <!-- E -->
    <line x1="256" y1="90" x2="256" y2="102" transform="rotate(180 256 212)"/> <!-- S -->
    <line x1="256" y1="90" x2="256" y2="102" transform="rotate(270 256 212)"/> <!-- W -->
  </g>

  <!-- Intercardinal marks (NE, SE, SW, NW) -->
  <g stroke="#64b5ff" stroke-width="1.5" opacity="0.4">
    <line x1="256" y1="90" x2="256" y2="100" transform="rotate(45 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="100" transform="rotate(135 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="100" transform="rotate(225 256 212)"/>
    <line x1="256" y1="90" x2="256" y2="100" transform="rotate(315 256 212)"/>
  </g>

  <!-- Cardinal direction labels -->
  <text x="256" y="114" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#e8f4ff" opacity="0.9" letter-spacing="1">N</text>
  <text x="256" y="320" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#64b5ff" opacity="0.6" letter-spacing="1">S</text>
  <text x="368" y="217" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#64b5ff" opacity="0.6" letter-spacing="1">E</text>
  <text x="144" y="217" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#64b5ff" opacity="0.6" letter-spacing="1">W</text>

  <!-- ===================== COMPASS NEEDLE ===================== -->
  <!-- North needle (white/ice — points up) -->
  <polygon
    points="256,106 244,212 256,198 268,212"
    fill="url(#northGrad)"
    filter="url(#needleGlow)"
  />

  <!-- South needle (dark blue — points down) -->
  <polygon
    points="256,318 244,212 256,228 268,212"
    fill="url(#southGrad)"
    opacity="0.7"
  />

  <!-- 8-point star burst at cardinal intersections -->
  <!-- Thin cross lines -->
  <line x1="256" y1="140" x2="256" y2="284" stroke="#64b5ff" stroke-width="0.5" opacity="0.25"/>
  <line x1="192" y1="212" x2="320" y2="212" stroke="#64b5ff" stroke-width="0.5" opacity="0.25"/>
  <line x1="209" y1="165" x2="303" y2="259" stroke="#64b5ff" stroke-width="0.5" opacity="0.18"/>
  <line x1="303" y1="165" x2="209" y2="259" stroke="#64b5ff" stroke-width="0.5" opacity="0.18"/>

  <!-- Center hub -->
  <circle cx="256" cy="212" r="14" fill="#0a1628" stroke="#64b5ff" stroke-width="1.5" opacity="0.9"/>
  <circle cx="256" cy="212" r="8" fill="#64b5ff" opacity="0.3"/>
  <circle cx="256" cy="212" r="4" fill="#e8f4ff" filter="url(#centerGlow)"/>

  <!-- North point star accent (4-pointed) -->
  <!-- The north needle tip gets a star/diamond accent -->
  <polygon points="256,106 252,114 256,118 260,114" fill="#00e088" filter="url(#centerGlow)"/>

  <!-- ============ WORDMARK ============ -->
  <text
    x="256"
    y="415"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="14"
    text-anchor="middle"
    fill="#e8f4ff"
  >ARCTIS</text>

  <text
    x="256"
    y="447"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="5"
    text-anchor="middle"
    fill="#64b5ff"
    opacity="0.8"
  >TRADING INTELLIGENCE</text>

  <line x1="196" y1="458" x2="316" y2="458" stroke="#00e088" stroke-width="1" opacity="0.6"/>
</svg>
