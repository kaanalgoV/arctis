<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgMono" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>

    <!-- "A" letter gradient (ice) -->
    <linearGradient id="letterGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="40%" stop-color="#8ac8ff"/>
      <stop offset="100%" stop-color="#3a78b8"/>
    </linearGradient>

    <!-- Frost detail gradient -->
    <linearGradient id="frostDetail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8e4ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#64b5ff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Green crossbar gradient -->
    <linearGradient id="crossbarGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e088" stop-opacity="0.0"/>
      <stop offset="20%" stop-color="#00e088"/>
      <stop offset="80%" stop-color="#00e088"/>
      <stop offset="100%" stop-color="#00e088" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="letterGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iceGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="frostGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="32" fill="url(#bgMono)"/>

  <!-- Background frost halo -->
  <circle cx="256" cy="210" r="145" fill="#64b5ff" opacity="0.03" filter="url(#frostGlow)"/>
  <circle cx="256" cy="210" r="105" fill="#8ac8ff" opacity="0.04" filter="url(#frostGlow)"/>

  <!-- ===================== FROST CRYSTAL DECORATIONS around "A" ===================== -->

  <!-- Top frost spikes (emanating from apex) -->
  <!-- Left top spike -->
  <line x1="256" y1="78" x2="210" y2="45" stroke="#8ac8ff" stroke-width="1.5" opacity="0.5" filter="url(#iceGlow)"/>
  <line x1="256" y1="78" x2="208" y2="55" stroke="#64b5ff" stroke-width="1" opacity="0.4"/>
  <!-- Right top spike -->
  <line x1="256" y1="78" x2="302" y2="45" stroke="#8ac8ff" stroke-width="1.5" opacity="0.5" filter="url(#iceGlow)"/>
  <line x1="256" y1="78" x2="304" y2="55" stroke="#64b5ff" stroke-width="1" opacity="0.4"/>
  <!-- Center top spike -->
  <line x1="256" y1="78" x2="256" y2="42" stroke="#8ac8ff" stroke-width="2" opacity="0.6" filter="url(#iceGlow)"/>
  <!-- Branch off center spike -->
  <line x1="256" y1="62" x2="246" y2="52" stroke="#64b5ff" stroke-width="1" opacity="0.5"/>
  <line x1="256" y1="62" x2="266" y2="52" stroke="#64b5ff" stroke-width="1" opacity="0.5"/>

  <!-- Small ice diamonds at spike tips -->
  <polygon points="256,42 252,50 256,48 260,50" fill="#e8f4ff" opacity="0.8" filter="url(#iceGlow)"/>
  <polygon points="210,45 214,53 218,49 214,47" fill="#8ac8ff" opacity="0.7"/>
  <polygon points="302,45 298,53 294,49 298,47" fill="#8ac8ff" opacity="0.7"/>

  <!-- Left side frost -->
  <line x1="168" y1="320" x2="128" y2="300" stroke="#64b5ff" stroke-width="1.2" opacity="0.35"/>
  <line x1="168" y1="320" x2="130" y2="325" stroke="#64b5ff" stroke-width="1" opacity="0.3"/>
  <line x1="168" y1="320" x2="138" y2="342" stroke="#64b5ff" stroke-width="1" opacity="0.3"/>

  <!-- Right side frost -->
  <line x1="344" y1="320" x2="384" y2="300" stroke="#64b5ff" stroke-width="1.2" opacity="0.35"/>
  <line x1="344" y1="320" x2="382" y2="325" stroke="#64b5ff" stroke-width="1" opacity="0.3"/>
  <line x1="344" y1="320" x2="374" y2="342" stroke="#64b5ff" stroke-width="1" opacity="0.3"/>

  <!-- Crossbar left frost -->
  <line x1="196" y1="238" x2="164" y2="226" stroke="#64b5ff" stroke-width="1" opacity="0.3"/>
  <line x1="196" y1="238" x2="162" y2="242" stroke="#64b5ff" stroke-width="1" opacity="0.25"/>
  <!-- Crossbar right frost -->
  <line x1="316" y1="238" x2="348" y2="226" stroke="#64b5ff" stroke-width="1" opacity="0.3"/>
  <line x1="316" y1="238" x2="350" y2="242" stroke="#64b5ff" stroke-width="1" opacity="0.25"/>

  <!-- ===================== MAIN "A" LETTERMARK ===================== -->
  <!-- The "A" is constructed as clean geometric paths -->
  <!-- It's a wide, bold, sharp geometric A inspired by mountain form -->

  <!-- Left leg of A -->
  <path
    d="M 144,332 L 256,78 L 368,332 L 336,332 L 256,132 L 176,332 Z"
    fill="url(#letterGrad)"
    filter="url(#letterGlow)"
  />

  <!-- Inner cutout of A (creates the hollow interior) -->
  <path
    d="M 256,145 L 198,312 L 314,312 Z"
    fill="#0a1628"
  />
  <!-- Slightly lighter inner face — gives depth -->
  <path
    d="M 256,145 L 314,312 L 256,255 Z"
    fill="#0d1f3c"
    opacity="0.8"
  />

  <!-- A crossbar -->
  <rect x="194" y="225" width="124" height="26" rx="4"
    fill="url(#letterGrad)"
    opacity="0.95"
  />

  <!-- Crossbar green accent line -->
  <rect x="194" y="250" width="124" height="3" rx="1.5"
    fill="url(#crossbarGreen)"
    opacity="0.9"
    filter="url(#iceGlow)"
  />

  <!-- Top apex highlight (snow/ice tip) -->
  <polygon
    points="256,78 270,110 256,105 242,110"
    fill="#e8f4ff"
    opacity="0.95"
  />

  <!-- Apex glow point -->
  <circle cx="256" cy="78" r="5" fill="#ffffff" filter="url(#frostGlow)"/>

  <!-- Inner "A" serif serifs at base (geometric fintech detail) -->
  <!-- Left base serif -->
  <rect x="144" y="326" width="42" height="8" rx="3" fill="url(#letterGrad)" opacity="0.9"/>
  <!-- Right base serif -->
  <rect x="326" y="326" width="42" height="8" rx="3" fill="url(#letterGrad)" opacity="0.9"/>

  <!-- ============ WORDMARK ============ -->
  <text
    x="256"
    y="415"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="14"
    text-anchor="middle"
    fill="#e8f4ff"
  >ARCTIS</text>

  <text
    x="256"
    y="447"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="5"
    text-anchor="middle"
    fill="#64b5ff"
    opacity="0.8"
  >TRADING INTELLIGENCE</text>

  <line x1="196" y1="458" x2="316" y2="458" stroke="#00e088" stroke-width="1" opacity="0.6"/>
</svg>
