<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgPeak" cx="50%" cy="60%" r="75%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>

    <!-- Mountain gradient -->
    <linearGradient id="peakMtGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c8e8ff"/>
      <stop offset="40%" stop-color="#64b5ff"/>
      <stop offset="100%" stop-color="#1a4060"/>
    </linearGradient>

    <!-- Chart line gradient (green rise) -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e088" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#00e088"/>
      <stop offset="100%" stop-color="#00e088" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Chart area fill -->
    <linearGradient id="chartAreaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e088" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e088" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="pkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="chartGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to chart region -->
    <clipPath id="chartClip">
      <rect x="80" y="140" width="352" height="180"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="32" fill="url(#bgPeak)"/>

  <!-- Subtle horizontal grid (chart grid) -->
  <g stroke="#64b5ff" stroke-width="0.5" opacity="0.08">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="200" x2="432" y2="200"/>
    <line x1="80" y1="240" x2="432" y2="240"/>
    <line x1="80" y1="280" x2="432" y2="280"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
  </g>
  <!-- Vertical grid -->
  <g stroke="#64b5ff" stroke-width="0.5" opacity="0.06">
    <line x1="148" y1="140" x2="148" y2="330"/>
    <line x1="216" y1="140" x2="216" y2="330"/>
    <line x1="284" y1="140" x2="284" y2="330"/>
    <line x1="352" y1="140" x2="352" y2="330"/>
  </g>

  <!-- ===================== MOUNTAIN SHAPE ===================== -->
  <!-- Back/shadow face (right side of mountain) -->
  <polygon
    points="256,108 372,310 256,255"
    fill="#1a3a5c"
    opacity="0.75"
  />

  <!-- Main mountain — light face -->
  <polygon
    points="256,108 140,310 372,310"
    fill="url(#peakMtGrad)"
    filter="url(#pkGlow)"
  />

  <!-- Shadow right face overlay -->
  <polygon
    points="256,108 372,310 256,255"
    fill="#0d2240"
    opacity="0.55"
  />

  <!-- Snow cap -->
  <polygon
    points="256,108 284,168 228,168"
    fill="#e8f4ff"
    opacity="0.95"
  />
  <!-- Snow cap shadow edge -->
  <polygon
    points="256,108 284,168 256,155"
    fill="#c8e0f8"
    opacity="0.6"
  />

  <!-- Peak bright point -->
  <circle cx="256" cy="108" r="4" fill="#ffffff" filter="url(#pkGlow)"/>

  <!-- ===================== CHART LINE (overlaid on mountain base) ===================== -->
  <!-- The chart line emerges from left, dips, rises to the peak area, continues right -->
  <!-- This tells the story: mountain = price chart going up -->

  <!-- Chart area fill (below the price line) -->
  <path
    d="M 80,310 L 108,285 L 136,295 L 164,270 L 192,260 L 220,240 L 248,210 L 256,180 L 264,210 L 292,230 L 320,215 L 348,225 L 376,205 L 404,210 L 432,195 L 432,310 Z"
    fill="url(#chartAreaFill)"
    clip-path="url(#chartClip)"
  />

  <!-- Chart price line (green) -->
  <polyline
    points="80,310 108,285 136,295 164,270 192,260 220,240 248,210 256,180 264,210 292,230 320,215 348,225 376,205 404,210 432,195"
    fill="none"
    stroke="url(#chartGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#chartGlow)"
  />

  <!-- Candlestick bars (small, behind mountain, at bottom) -->
  <g opacity="0.35" fill="#64b5ff">
    <rect x="100" y="290" width="5" height="18" rx="1"/>
    <rect x="120" y="283" width="5" height="24" rx="1"/>
    <rect x="140" y="288" width="5" height="20" rx="1"/>
    <rect x="160" y="272" width="5" height="22" rx="1"/>
    <rect x="180" y="265" width="5" height="18" rx="1"/>
  </g>
  <g opacity="0.35" fill="#00e088">
    <rect x="340" y="208" width="5" height="22" rx="1"/>
    <rect x="360" y="200" width="5" height="28" rx="1"/>
    <rect x="380" y="195" width="5" height="24" rx="1"/>
    <rect x="400" y="192" width="5" height="20" rx="1"/>
    <rect x="420" y="185" width="5" height="18" rx="1"/>
  </g>

  <!-- Price peak marker dot -->
  <circle cx="432" cy="195" r="5" fill="#00e088" filter="url(#chartGlow)"/>
  <circle cx="432" cy="195" r="9" fill="none" stroke="#00e088" stroke-width="1.5" opacity="0.4"/>

  <!-- Baseline -->
  <line x1="80" y1="310" x2="432" y2="310" stroke="#64b5ff" stroke-width="1" opacity="0.3"/>

  <!-- ============ WORDMARK ============ -->
  <text
    x="256"
    y="415"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="14"
    text-anchor="middle"
    fill="#e8f4ff"
  >ARCTIS</text>

  <text
    x="256"
    y="447"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="5"
    text-anchor="middle"
    fill="#64b5ff"
    opacity="0.8"
  >TRADING INTELLIGENCE</text>

  <line x1="196" y1="458" x2="316" y2="458" stroke="#00e088" stroke-width="1" opacity="0.6"/>
</svg>
