<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0A0D12"/>
  <!-- Mountain / peak shape representing Arctis -->
  <polygon
    points="16,5 28,26 4,26"
    fill="none"
    stroke="#5CB8F0"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <!-- Inner smaller peak (snow cap detail) -->
  <polygon
    points="16,5 21,14 11,14"
    fill="#5CB8F0"
    opacity="0.3"
  />
</svg>
