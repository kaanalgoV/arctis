[project]
name = "arctis-engine"
version = "0.1.0"
description = "Arctis Trading Decision Support - Analysis Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arctis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
